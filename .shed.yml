# Tool Shed repository of the repertoire_profiler Galaxy tool (galaxy/repertoire_profiler.xml), with the pipeline files it runs.
# The Tool Shed repository keeps the layout of this git repository, so that the tool finds the pipeline in its parent folder.
# The owner is the Tool Shed account of the API key used for the upload (or the --owner option of planemo).
#
# Check (lint of the tool and of this repository):
#   bash galaxy/local/test.sh lint
# Upload, from the root of this git repository (API key: user menu of the Tool Shed > Preferences > Manage API key):
#   planemo shed_create --shed_target https://toolshed.pasteur.fr --shed_key <API_KEY> .                (first upload)
#   planemo shed_update --shed_target https://toolshed.pasteur.fr --shed_key <API_KEY> --check_diff .   (next versions)
name: repertoire_profiler
description: Ig/TR repertoire analysis with the repertoire_profiler Nextflow pipeline (V(D)J annotation, clonal groups, mutation load, alignments, trees)
long_description: |
  Galaxy tool running the whole repertoire_profiler Nextflow pipeline in a single Galaxy job, on nucleotide
  sequences of immunoglobulins (BCR) or T cell receptors: V(D)J annotation with IgBlast, productive sequences,
  clonal groups, mutation load, gene and allele repertoires, alignments, phylogenetic trees and an HTML report.
  The form of the tool recapitulates the nextflow.config file of the pipeline.

  Requirements on the Galaxy server: the RP_APPTAINER_CACHE job environment variable (folder of the apptainer
  images of the pipeline, pulled by the first job, or beforehand with galaxy/pull_images.sh if the computing
  nodes have no internet access) and the HTML report allowed in the sanitization allowlist.
  See the comment at the top of galaxy/repertoire_profiler.xml.
homepage_url: https://github.com/gael-millot/repertoire_profiler
remote_repository_url: https://github.com/gael-millot/repertoire_profiler
type: unrestricted
categories:
  - Sequence Analysis
  - Phylogenetics
include:
  - galaxy/repertoire_profiler.xml
  - galaxy/fill_config.py
  - galaxy/locked_params.txt
  - galaxy/pull_images.sh
  - galaxy/test-data
  - main.nf
  - nextflow.config
  - bin
  - conf
  - modules
  - Licence.txt
